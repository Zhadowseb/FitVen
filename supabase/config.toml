[functions.send-workout-started-notification]
verify_jwt = false

[functions.manage-push-token]
verify_jwt = true

# Called by a cron job, which has no user's JWT to send. The function checks
# STORE_STATS_CRON_SECRET itself before it does anything else.
[functions.store-stats]
verify_jwt = false

# Called by a Database Webhook on social_post_like, which has no user's JWT to
# send. The function checks FITVEN_NOTIFICATION_WEBHOOK_SECRET itself first.
[functions.send-post-liked-notification]
verify_jwt = false

# Called by a Database Webhook on workout_cheer, same secret check as above.
[functions.send-cheer-notification]
verify_jwt = false

# Ask FitVen. Called by the app with the person's JWT, which the function
# verifies again itself; it only reads that person's own data.
[functions.ask-fitven]
verify_jwt = true
