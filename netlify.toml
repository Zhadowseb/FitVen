# Publishes web/ and nothing else.
#
# The repository is private and stays private. Only the privacy policy has to be
# public, so the published directory is the one folder that holds it. Pointing
# this at "." or at "docs" would put the security review, the structure audit,
# the performance audit and an export query on the open internet next to it.
#
# There is no build step: web/privacy/index.html is generated by
# `npm run build:privacy-policy` and committed, and npm test fails if it has
# drifted from the policy the app shows.

[build]
  publish = "web"
  command = ""

[[redirects]]
  from = "/"
  to = "/privacy/"
  status = 302
