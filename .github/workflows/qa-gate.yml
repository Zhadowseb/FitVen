name: QA gate

# Marks every pull request as not yet reviewed by the agents.
#
# The agents no longer run on their own - a review on a branch somebody is
# still pushing to is read by nobody, and it costs real money each time. They
# run when they are asked for, by commenting `/qa` on the pull request.
#
# This workflow is the other half of that: it puts a failing check called
# "QA agents" on every new head, and the review workflow turns it green when it
# has actually run. Make "QA agents" a required check in the branch protection
# rule and a pull request cannot be merged until the review has happened - and
# a new push puts it back to red, because those commits have not been read.
#
# To merge without it, remove the check from the required list or merge with an
# admin override. That is meant to take a deliberate action.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  checks: write

jobs:
  mark-unreviewed:
    runs-on: ubuntu-latest
    steps:
      - name: Mark this head as unreviewed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          gh api "repos/$REPO/check-runs" \
            -X POST \
            -f name='QA agents' \
            -f head_sha="$SHA" \
            -f status='completed' \
            -f conclusion='action_required' \
            -f 'output[title]=The review agents have not read this yet' \
            -f 'output[summary]=Comment `/qa` on this pull request to run them. They do not run on their own: a review of a branch somebody is still pushing to is read by nobody. A new push puts this back, because the new commits have not been read either.' \
            > /dev/null

          echo "QA agents marked as not run for $SHA"
